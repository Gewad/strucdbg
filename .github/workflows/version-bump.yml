name: Version Bump and Changelog

on:
  pull_request:
    types: [closed]
    branches:
      - main

jobs:
  bump-version:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Generate token
        id: generate-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
        continue-on-error: true
      
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.generate-token.outputs.token || secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Determine version bump type
        id: version-type
        run: |
          SOURCE_BRANCH="${{ github.event.pull_request.head.ref }}"
          echo "Source branch: $SOURCE_BRANCH"
          
          if [[ "$SOURCE_BRANCH" == feature/* ]]; then
            echo "type=minor" >> $GITHUB_OUTPUT
            echo "Version bump: minor (feature branch)"
          elif [[ "$SOURCE_BRANCH" == hotfix/* ]]; then
            echo "type=patch" >> $GITHUB_OUTPUT
            echo "Version bump: patch (hotfix branch)"
          else
            echo "type=patch" >> $GITHUB_OUTPUT
            echo "Version bump: patch (default)"
          fi
      
      - name: Bump version and generate changelog
        run: |
          npm version ${{ steps.version-type.outputs.type }} -m "chore(release): bump version to %s [skip ci]"
      
      - name: Push changes
        run: |
          git push origin main --follow-tags
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token || secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
      
      - name: Get new version
        id: package-version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "New version: $VERSION"
      
      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token || secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.package-version.outputs.version }}
          release_name: Release v${{ steps.package-version.outputs.version }}
          body: |
            Automated release from merge to main.
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.
          draft: false
          prerelease: false
      
      - name: Install vsce
        run: npm install -g @vscode/vsce
      
      - name: Publish to VS Code Marketplace
        run: |
          cd scripts
          chmod +x publish.sh
          ./publish.sh
        env:
          VSCE_PAT: ${{ secrets.MARKETPLACE_TOKEN }}
